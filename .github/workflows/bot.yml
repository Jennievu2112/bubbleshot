name: Auto Tracker
on:
  schedule:
    - cron: '0 */4 * * *' # Chạy tự động mỗi 4 tiếng
  workflow_dispatch: # Cho phép bấm chạy thủ công
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - run: node script.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
